[package]
name = "vg-audit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Append-only, redaction-safe audit sink implementing vg-core::AuditSink."

[lints]
workspace = true

# Dependency set deliberately limited to packages already in the workspace lockfile
# (serde/serde_json via criterion's tree, thiserror/uuid via vg-core): this task ran in a
# headless dispatch without a runnable cargo, so Cargo.lock was updated by hand — safe
# only for edges between already-locked packages. Notably uuid's "serde" feature is NOT
# enabled (the storage schema carries UUIDs as strings instead) because that would add a
# lock edge that can't be verified by hand.
[dependencies]
vg-core = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# `telemetry_sink`'s own end-to-end emitter test independently recomputes an HMAC-SHA256
# over a real received wire record and compares it against the signature that arrived, to
# verify `vg_core::telemetry`'s signing without needing that crate's `pub(crate)`
# canonical-JSON renderer -- same crates, same versions, already resolved in the workspace
# lock via `vg-core`'s own (non-dev) dependency on both.
hmac = "0.12"
sha2 = "0.10"
