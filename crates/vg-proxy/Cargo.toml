[package]
name = "vg-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Local masking-proxy daemon front door (vg-daemon/vg-proxy): a plain-HTTP loopback server Claude Code is pointed at via ANTHROPIC_BASE_URL, masking the assembled request/response instead of a per-invocation hook. M1: transport + routing skeleton. M2: daemon core — vault opened once, H2 session-namespace shim, session-scoped binding store. M3: request masking (Anthropic direct, non-streaming) — schema/anthropic.rs + mask_request.rs wired end-to-end against a mock upstream."

[lints]
workspace = true

[dependencies]
vg-core = { workspace = true }
vg-vault = { workspace = true }
# M3: mask_request.rs composes the real pipeline (same shape as vg-adapters-claude's Engine) —
# detectors + parsers feed vg_core::Context; the vault/policy/audit trait objects populate
# vg_core::Policy.
vg-detectors = { workspace = true }
vg-parsers = { workspace = true }
vg-policy = { workspace = true }
vg-audit = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1"] }
thiserror = "1"
uuid = "1"
# Anthropic Messages API request bodies are JSON; serde/serde_json are already resolved in the
# workspace lock (vg-policy, vg-audit, vg-adapters-claude), so this adds no new registry crate.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A2: real TLS to the real upstream. rustls over native-tls — pure-Rust, no OpenSSL/
# Security.framework FFI — an explicit human choice (veil-ecosystem docs/decisions.md,
# 2026-09-13, INT-2026-09-13-001), matching XREPO-015's own precedent for this family's
# telemetry-TLS surface. `ring` (not `aws-lc-rs`) as the crypto provider: no new system-level
# build dependency (`aws-lc-rs` needs a C/assembler toolchain at build time) beyond what this
# workspace already builds cleanly with. `tls12` kept alongside the default TLS 1.3 support
# since it costs nothing to allow and some real-world endpoints still negotiate it.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The trust-root source for `UpstreamConfig::real_anthropic()`: the real OS trust store (macOS
# Security.framework, beta's own scoped platform) via `rustls-native-certs`, not a bundled
# Mozilla CA list — deliberately switched from `webpki-roots` during this milestone's own build
# after `cargo deny check licenses` rejected `webpki-roots`' CDLA-Permissive-2.0 license (not in
# this repo's `deny.toml` allow-list). Rather than expand that allow-list unilaterally,
# `rustls-native-certs` (dual MIT/Apache-2.0, already allowed) sidesteps the policy question
# entirely and ties trust to whatever CAs the device itself already trusts, which tracks the
# OS's own security updates instead of this crate's own release cadence.
rustls-native-certs = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "io-util", "sync"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
# A2's own TLS tests need a real local TLS server (rustls-based) presenting both a
# validly-signed-by-a-test-CA certificate (the happy path) and a wrong-host/untrusted one (the
# must-reject path) — rcgen generates both without shelling out to `openssl`.
rcgen = "0.13"
