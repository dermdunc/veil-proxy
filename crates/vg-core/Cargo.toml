[package]
name = "vg-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "VeilGremlin shared types and library API (scan/mask/rehydrate/benchmark)."

[lints]
workspace = true

[dependencies]
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
hmac = "0.12"
sha2 = "0.10"
# `telemetry::{envelope,edge_event,ids}`'s wire-serialization contract (this crate's own
# `Serialize` impls are all hand-written, field-by-field -- no `#[derive(Serialize)]`
# anywhere in `telemetry`, so the "derive" feature is not needed). `serde_json` backs
# `telemetry::canonical`'s canonicalizer (`Value` tree + our own sorted-key renderer) and
# is already resolved in the workspace lock via vg-policy/vg-audit/vg-cli/etc.
serde = "1"
serde_json = "1"
# `telemetry::emitter`'s fire-and-forget HTTP POST of a signed `veil.edge_event.v1` record
# to the (opt-in) `VEIL_OBSERVATORY_ENDPOINT`. Adds no new registry crate to the workspace
# lock: `crates/vg-proxy/Cargo.toml` already depends on `tokio` (rt-multi-thread, net) and
# `hyper` (server, client, http1) at these exact major versions, so this is a new
# dependency *edge* onto already-resolved crates, not a new version to fetch. Feature set
# kept to the minimum this module actually calls -- no "rt-multi-thread" (the emitter owns
# one dedicated background OS thread with a single-threaded runtime, not a pool: see
# `emitter.rs`'s own doc for why), no "server" on `hyper` (this crate only ever originates
# requests, never accepts them -- that's `vg-proxy`'s job).
tokio = { version = "1", features = ["rt", "net", "time"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[dev-dependencies]
# Dev-only: lets keying's tests exercise real `Finding`s from `vg-detectors::all_detectors()`
# (interface-contracts.md acceptance criterion, added 2026-07-16) rather than only hand-built
# mock values. Not a real dependency cycle — vg-detectors' (non-dev) dependency on vg-core is
# the only edge in the normal build graph; this edge exists solely for vg-core's own test
# binary and Cargo resolves dev-dependency cycles like this without issue.
vg-detectors = { workspace = true }
# T07 pipeline wiring: the end-to-end `mask`/`scan` integration tests (`tests/pipeline.rs`)
# and the criterion bench compose the *real* Wave B implementations through `vg-core`'s own
# trait objects. Same dev-only, resolves-fine cycle as `vg-detectors` above — none of these is
# a normal-build dependency of `vg-core`.
vg-parsers = { workspace = true }
vg-vault = { workspace = true }
vg-policy = { workspace = true }
vg-audit = { workspace = true }
tempfile = "3"
criterion = "0.5"

[[bench]]
name = "mask_pipeline"
harness = false
